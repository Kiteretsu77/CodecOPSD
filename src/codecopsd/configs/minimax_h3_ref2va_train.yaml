# CodecOPSD training of a MiniMax-H3 student (scripts/train_minimax_h3_ref2va.py): the recipe of the released student.
#
# Teacher = the released Ref2VA transformer, frozen, every reference token, full attention.
# Student = the same frozen weights + a LoRA on the reference rows, given only the reference tokens the codec gazer keeps
# (configs/codec_gazer.yaml). The two share one copy of the weights: the teacher is the student with the LoRA off.
# No ground-truth video: the teacher's prediction at the student's own state is the target.

lora:
  rank: 128
  alpha: 128                 # scale alpha / rank = 1
  targets: [attn.to_q, attn.to_k, attn.to_v, attn.to_out.0, ff.net.0.proj, ff.net.2]   # every block
  last_block_targets: [attn.to_k, attn.to_v]   # last block: the reference rows only feed keys / values
  # init: down ~ N(0, 1 / rank), up = 0 -> the student starts as the teacher; factors in float32, cast to bfloat16 per use

codecopsd:
  rollout_steps: 16          # the student samples on the 16-step grid of the released scheduler (shift 12)
  vlm_drop: true             # the student's text encoder reads only the gazed vision tokens (configs/codec_gazer.yaml
                             # vlm_drop); the teacher reads every one
  # Per update one k is drawn uniformly from [0, rollout_steps), the same on every GPU (no GPU waits for a longer
  # rollout): the student takes k Euler steps from noise without gradients (LoRA on, gazed references), then at that
  # state x_k both models predict the velocity; loss = MSE(student, teacher) over the generated video rows, float32.
  # The last step (sigma 0.44 -> 0) is never a supervised state. No guidance anywhere (the released model is
  # guidance-distilled).

optimizer:                   # AdamW on the LoRA only (our runs used 8-bit AdamW)
  lr: 5.0e-5
  weight_decay: 0.0
  eps: 1.0e-8
  betas: [0.9, 0.999]
  max_grad_norm: 1.0
  # constant learning rate, no warmup

batch:
  per_gpu: 1                 # one packed sample per GPU (lengths differ per sample)
  gradient_accumulation: 2   # our runs: 7 GPUs x 1 x 2 = 14 samples per update
updates: 2000                # the released student: 3,000 updates of 14 samples (docs/training.md); ablations 1,000
save_every: 100              # updates
seed: 42                     # data order, rollout noise and k

data:                        # sample shapes (frames at 24 fps, 17n + 5; height x width), drawn per update for all GPUs
  frames: {56: 0.8, 124: 0.2}
  sizes: {480x640: 0.715, 480x832: 0.25, 704x384: 0.025, 384x832: 0.01}
  max_pictures: 9
  max_videos: 5

memory:                      # per training GPU, the full 62 GB transformer in bfloat16
  gradient_checkpointing: true   # per block
  # transformer 62 GB + LoRA 2.6 GB + its gradients 2.6 GB + AdamW states 5.2 GB (1.3 GB with 8-bit AdamW)
  # + activations: an 80 GB GPU is not enough; we trained on H200 (141 GB) and B200 (180 GB).
  # The text encoder and the VAE do not run in the training loop: `encode` stores every sample's text embedding, reference
  # latents and gazer masks first.
